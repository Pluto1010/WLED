# Example PlatformIO Project Configuration Override
# ------------------------------------------------------------------------------
# Copy to platformio_override.ini to activate overrides
# ------------------------------------------------------------------------------
# Please visit documentation: https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = esp8266_Pluto1010_160MHz

[env:esp8266_Pluto1010]
extends = env:nodemcuv2
; Override only what’s needed for your wiring
build_flags = ${common.build_flags} ${esp8266.build_flags} -D WLED_RELEASE_NAME=\"ESP8266_Pluto1010\"
  -D DATA_PINS=2
  -D LED_TYPES=TYPE_SK6812_RGBW
  -D IRPIN=4
  -D RLYPIN=12
  -D RLYMDE=1
  -D WLED_DISABLE_2D
; Optional: set ports if you want to pin them
; upload_port = /dev/cu.usbserial-XXXX
; monitor_port = /dev/cu.usbserial-XXXX
; upload_speed = 921600

[env:esp8266_Pluto1010_160MHz]
extends = env:esp8266_Pluto1010
board_build.f_cpu = 160000000L
