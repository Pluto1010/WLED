# PlatformIO Project Configuration Override for Pluto1010 WLED
# This file allows you to maintain custom configurations while keeping
# platformio.ini unchanged for easy upstream updates

[platformio]
default_envs = esp8266_Pluto1010_160MHz

[env:esp8266_Pluto1010_160MHz]
extends = env:nodemcuv2_160
lib_deps = 
    ${esp8266.lib_deps}
    ESP8266PWM  # Custom library for PWM fix
lib_extra_dirs = lib

build_flags = ${common.build_flags} ${esp8266.build_flags} 
    -D WLED_RELEASE_NAME=\"ESP8266_Pluto1010_160MHz\"
    -D DATA_PINS=2
    -D LED_TYPES=TYPE_SK6812_RGBW
    -D IRPIN=4
    -D RLYPIN=12
    -D RLYMDE=1
    -D WLED_DISABLE_2D
    -D USERMOD_AUDIOREACTIVE  # Added since you're using 160MHz
